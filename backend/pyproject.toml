[project]
name = "demoday-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "jsonschema>=4.23",
  "pillow>=13.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "datamodel-code-generator>=0.26",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/contracts/scenario.py", "app/contracts/capture.py", "app/contracts/scene.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
